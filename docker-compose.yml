services:
  db:
    image: postgres:18-alpine
    container_name: gtc-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: gtc_dev
      POSTGRES_USER: gtc
      POSTGRES_PASSWORD: gtc_local_only
      TZ: Asia/Taipei
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtc -d gtc_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gtc_postgres_data:/var/lib/postgresql

volumes:
  gtc_postgres_data:
